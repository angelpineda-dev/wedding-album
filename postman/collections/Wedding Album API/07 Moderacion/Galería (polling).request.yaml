$kind: http-request
method: GET
url: '{{baseUrl}}/public/events/{{eventCode}}/gallery'
order: 3000
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      pm.test('aparece la foto aprobada', () => pm.expect(pm.response.json().data.items.map(i => i.id)).to.include(pm.environment.get('mediaId')));
