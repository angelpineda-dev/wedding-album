$kind: http-request
method: POST
url: '{{baseUrl}}/events/{{eventId}}/media/{{mediaId}}/approve'
order: 2000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      pm.test('publicada', () => pm.expect(pm.response.json().data.status).to.eql('PUBLISHED'));
