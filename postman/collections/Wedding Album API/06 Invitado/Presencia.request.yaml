$kind: http-request
description: |-
  La posición no se guarda. Prueba con 20.2963, -103.1906 (≈43 km) para ver `inside: false`.
method: POST
url: '{{baseUrl}}/guest/presence'
order: 5000
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "latitude": 20.66,
      "longitude": -103.35
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      pm.test('puede subir', () => pm.expect(pm.response.json().data.canUpload).to.eql(true));
