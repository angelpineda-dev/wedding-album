$kind: http-request
description: |-
  `packageMax` múltiplo de 25. Cupo de invitados = packageMax + 5.
method: POST
url: '{{baseUrl}}/admin/events/{{eventId}}/enable'
order: 2000
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "packageMax": 100
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      pm.test('cupo = paquete + 5', () => pm.expect(pm.response.json().data.guestLimit).to.eql(105));
