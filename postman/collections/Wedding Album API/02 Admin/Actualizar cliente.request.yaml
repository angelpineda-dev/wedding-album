$kind: http-request
description: |-
  Cambia `eventQuota` y/o `status` (ACTIVE | SUSPENDED). Suspender revoca todas sus sesiones.
method: PATCH
url: '{{baseUrl}}/admin/clients/{{clientId}}'
order: 2000
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "eventQuota": 3
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
