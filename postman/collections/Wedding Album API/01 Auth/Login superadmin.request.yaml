$kind: http-request
description: |-
  Crea antes el superadmin con `npm run seed:superadmin`. Guarda `adminToken`.
method: POST
url: '{{baseUrl}}/auth/login'
order: 1000
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "email": "{{adminEmail}}",
      "password": "{{adminPassword}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      pm.environment.set('adminToken', pm.response.json().data.accessToken);
