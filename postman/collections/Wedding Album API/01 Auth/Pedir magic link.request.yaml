$kind: http-request
description: |-
  Siempre responde 202 (no revela si el correo existe). Solo envía enlace a clientes activos.
method: POST
url: '{{baseUrl}}/auth/magic-link'
order: 3000
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "email": "{{clientEmail}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 202', () => pm.response.to.have.status(202));
