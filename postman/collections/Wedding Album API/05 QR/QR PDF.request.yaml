$kind: http-request
method: GET
url: '{{baseUrl}}/events/{{eventId}}/qr.pdf'
order: 2000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      pm.test('pdf', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('application/pdf'));
