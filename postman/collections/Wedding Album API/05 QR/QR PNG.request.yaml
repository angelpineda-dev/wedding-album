$kind: http-request
description: |-
  Solo para eventos habilitados (409 antes). En Postman usa "Send and Download".
method: GET
url: '{{baseUrl}}/events/{{eventId}}/qr.png'
order: 1000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      pm.test('png', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('image/png'));
